- intent: git_undo_last_commit
  patterns:
    - "undo last commit"
    - "undo (the )?last (git )?commit"
    - "revert last commit"
    - "uncommit"
  command: "git reset --soft HEAD~1"
  tags: [git, undo]

- intent: git_status
  patterns:
    - "git status"
    - "(show )?(git )?(status|changes)"
    - "what (files )?changed"
    - "modified files"
  command: "git status"
  tags: [git, status]

- intent: git_log
  patterns:
    - "(show )?(git )?log"
    - "(recent|last) commits"
    - "commit history"
    - "git history"
  command: "git log --oneline -20"
  tags: [git, log]

- intent: git_diff
  patterns:
    - "(show )?(git )?diff"
    - "show (the )?changes"
    - "what (did I|was) change(d)?"
  command: "git diff"
  tags: [git, diff]

- intent: git_stash
  patterns:
    - "(git )?stash (changes|everything)"
    - "save changes (to )?stash"
    - "stash my (work|changes)"
  command: "git stash"
  tags: [git, stash]

- intent: git_stash_pop
  patterns:
    - "(git )?stash pop"
    - "(restore|apply) stash"
    - "pop stash"
    - "get (back )?stashed changes"
  command: "git stash pop"
  tags: [git, stash]

- intent: git_create_branch
  patterns:
    - "create (a )?(new )?(git )?branch (named|called) {name}"
    - "(new|make) branch {name}"
    - "git checkout -b {name}"
  slots:
    name: { type: string }
  command: "git checkout -b {name}"
  tags: [git, branch]

- intent: git_list_branches
  patterns:
    - "(list|show) (all )?(git )?branches"
    - "(git )?branches"
  command: "git branch -a"
  tags: [git, branch]

- intent: git_discard_changes
  patterns:
    - "discard (all )?(uncommitted )?changes"
    - "reset (all )?changes"
    - "throw away changes"
  command: "git checkout -- ."
  tags: [git, undo]

- intent: git_blame
  patterns:
    - "(git )?blame {filename}"
    - "who (changed|modified|wrote) {filename}"
    - "show blame (for )?{filename}"
  slots:
    filename: { type: filename }
  command: "git blame {filename}"
  tags: [git, blame]

- intent: git_clone
  patterns:
    - "(git )?clone {url}"
    - "clone (repo|repository) {url}"
  slots:
    url: { type: string }
  command: "git clone {url}"
  tags: [git, clone]
