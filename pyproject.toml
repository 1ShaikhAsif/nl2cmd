[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2cmd"
version = "0.1.0"
description = "Natural Language to Shell Commands — type what you want, get the command."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "10x Analysts"}]
keywords = ["cli", "linux", "shell", "natural-language", "command-line"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "thefuzz[speedup]>=0.22",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
ollama = ["ollama>=0.4"]
groq = ["groq>=0.11"]
all = [
    "anthropic>=0.40",
    "openai>=1.0",
    "google-genai>=1.0",
    "ollama>=0.4",
    "groq>=0.11",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "anthropic>=0.40",
]

[project.scripts]
nl2cmd = "nl2cmd.cli:main"

[project.urls]
Homepage = "https://github.com/10x-analysts/nl2cmd"
Repository = "https://github.com/10x-analysts/nl2cmd"
Issues = "https://github.com/10x-analysts/nl2cmd/issues"

[tool.setuptools.packages.find]
include = ["nl2cmd*"]

[tool.setuptools.package-data]
nl2cmd = ["rules/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
